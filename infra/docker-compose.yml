# Local MongoDB for development (plan 4.6).
# Start: docker compose -f infra/docker-compose.yml up -d
# Stop:  docker compose -f infra/docker-compose.yml down   (add -v to also delete the data)
#
# Single-node replica set "rs0", like Atlas: multi-document transactions work locally.
# No authentication: the port is published on 127.0.0.1 only, so nothing outside this PC can reach it.
name: medikart

services:
  mongodb:
    image: mongo:8.0.32 # same major version as the Atlas cluster (8.0)
    container_name: medikart-mongodb
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once the node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb-data:
