spring.application.name=medikart-backend

# Local values and secrets, never committed (template: .env.example).
# Read from the working directory (backend/ when started with ./mvnw).
# Real environment variables take precedence over this file.
spring.config.import=optional:file:.env[.properties]

# MongoDB: local Docker by default (infra/docker-compose.yml).
# The "atlas" profile (application-atlas.properties) switches to Atlas.
spring.mongodb.uri=mongodb://localhost:27017/?replicaSet=rs0
spring.mongodb.database=medikart
# Indexes are created by migration scripts only (ERD §6, plan 4.7)
spring.data.mongodb.auto-index-creation=false
