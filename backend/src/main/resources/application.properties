spring.application.name=medikart-backend

# Local values and secrets, never committed (template: .env.example).
# Read from the working directory (backend/ when started with ./mvnw).
# Real environment variables take precedence over this file.
spring.config.import=optional:file:.env[.properties]

# MongoDB: local Docker by default (infra/docker-compose.yml).
# The "atlas" profile (application-atlas.properties) switches to Atlas.
spring.mongodb.uri=mongodb://localhost:27017/?replicaSet=rs0
spring.mongodb.database=medikart
# Indexes are created by migration scripts only (ERD §6, plan 4.7)
spring.data.mongodb.auto-index-creation=false

# The traceId of the request in every log line (plan 4.9, common.trace.TraceIdFilter)
logging.pattern.correlation=[%X{traceId:-}]\u0020

# API documentation (plan 4.10): OpenAPI at /v3/api-docs, Swagger UI at /swagger-ui.html.
# Public while enabled, so keep them on in dev only: staging and prod set both to false.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Version shown in the documentation: the Maven project version (filtered at build time)
medikart.api.version=@project.version@

# GET /api/v1/app-config (plan 4.11, report §10.2). Read from here, never from the code.
# Environment variables work too, e.g. MEDIKART_APPCONFIG_SUPPORTEMAIL (also from backend/.env).
medikart.app-config.minimum-version=0.0.1
# Not set yet (no domain before plan 15.8): returned as null until a value is configured.
# medikart.app-config.privacy-policy-url=https://...
# medikart.app-config.terms-of-service-url=https://...
# medikart.app-config.support-email=...

# Dates and times (plan 4.8, report §10.1). Formats of the civil types: common.time.TimeConfig.
# JSON instants as ISO-8601 text in UTC (2026-10-02T12:30:00Z), never as numbers
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# Instants received are cut to the millisecond, the precision of a MongoDB Date
spring.jackson.datatype.datetime.truncate-to-msecs-on-read=true
# Query and path parameters: civil dates YYYY-MM-DD, times HH:mm
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
